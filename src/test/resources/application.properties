quarkus.jacoco.includes=**/*

# DataSource
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Hibernate ORM
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.log.min-level=TRACE

# JWT Security
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=banco-api
smallrye.jwt.sign.key.location=privateKey.pem

# Hibernate ORM - DDL Generation
#quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=bancada.sql
quarkus.hibernate-orm.schema-management.halt-on-error=true

quarkus.arc.fail-on-intercepted-private-method=false

quarkus.jacoco.report-location=target/site/jacoco